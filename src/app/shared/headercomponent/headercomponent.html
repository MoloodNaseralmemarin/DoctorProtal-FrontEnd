<!-- Full-screen Mobile Navigation -->
<div
  *ngIf="isMenuOpen"
  class="fixed inset-0 bg-cream-50 z-9999 flex flex-col xl:hidden animate-in fade-in duration-300"
>
  <div class="flex flex-col h-full pt-24 px-10 overflow-y-auto bg-cream-50">
    <!-- Close Button -->
    <button
      (click)="toggleMenu()"
      class="absolute top-6 left-6 p-3 bg-cream-100 rounded-2xl text-emerald-800 hover:bg-cream-200 transition-all active:scale-90"
    >
      <i class="fas fa-times text-2xl"></i>
    </button>

    <div class="flex flex-col space-y-5">
      <a
        href="#home"
        (click)="toggleMenu()"
        class="text-xl font-bold text-slate-800 hover:text-emerald-700 transition-colors flex justify-between items-center py-4 border-b border-cream-100"
      >
        صفحه اصلی
        <i class="fas fa-chevron-left text-sm text-amber-500"></i>
      </a>
      <a
        href="#services"
        (click)="toggleMenu()"
        class="text-xl font-bold text-slate-800 hover:text-emerald-700 transition-colors flex justify-between items-center py-4 border-b border-cream-100"
      >
        خدمات
        <i class="fas fa-chevron-left text-sm text-amber-500"></i>
      </a>
      <a
        href="#education"
        (click)="toggleMenu()"
        class="text-xl font-bold text-slate-800 hover:text-emerald-700 transition-colors flex justify-between items-center py-4 border-b border-cream-100"
      >
        آموزش و سلامت
        <i class="fas fa-chevron-left text-sm text-amber-500"></i>
      </a>
      <a
        href="#gallery"
        (click)="toggleMenu()"
        class="text-xl font-bold text-slate-800 hover:text-emerald-700 transition-colors flex justify-between items-center py-4 border-b border-cream-100"
      >
        گالری
        <i class="fas fa-chevron-left text-sm text-amber-500"></i>
      </a>
      <a
        href="#articles"
        (click)="toggleMenu()"
        class="text-xl font-bold text-slate-800 hover:text-emerald-700 transition-colors flex justify-between items-center py-4 border-b border-cream-100"
      >
        مقالات
        <i class="fas fa-chevron-left text-sm text-amber-500"></i>
      </a>
      <a
        href="#doctorProfile"
        (click)="toggleMenu()"
        class="text-xl font-bold text-slate-800 hover:text-emerald-700 transition-colors flex justify-between items-center py-4 border-b border-cream-100"
      >
        درباره ما
        <i class="fas fa-chevron-left text-sm text-amber-500"></i>
      </a>
      <a
        href="#footer"
        (click)="toggleMenu()"
        class="text-xl font-bold text-slate-800 hover:text-emerald-700 transition-colors flex justify-between items-center py-4 border-b border-cream-100"
      >
        تماس با ما
        <i class="fas fa-chevron-left text-sm text-amber-500"></i>
      </a>
    </div>

    <div class="mt-auto py-8 space-y-6">
      <div class="pt-6 border-t border-cream-100">
        <div
          class="w-full bg-emerald-800 text-cream-50 px-6 py-4 rounded-2xl text-center shadow-lg border border-amber-500/20"
        >
          <span class="text-xs text-amber-300 block mb-1">جهت دریافت نوبت:</span>
          <div
            class="flex items-center justify-center gap-x-3 font-semibold text-[14px] tracking-tight"
          >
            <a href="tel:09183050600" dir="ltr" class="whitespace-nowrap hover:text-amber-300">0918 305 0600</a>
            <span class="opacity-30 text-xs">|</span>
            <a href="tel:09183159274" dir="ltr" class="whitespace-nowrap hover:text-amber-300">0918 315 9274</a>
          </div>
        </div>
      </div>

      <div class="flex justify-center gap-4 pb-6">
        <a
          *ngFor="let item of footerData?.social"
          [href]="item.link"
          class="w-12 h-12 rounded-xl bg-cream-100 flex items-center justify-center text-emerald-800 hover:bg-emerald-700 hover:text-cream-50 transition-all duration-300 border border-cream-200"
        >
          <i [ngClass]="['fa-brands', 'fa-' + item.icon, 'text-xl']"></i>
        </a>
      </div>
    </div>
  </div>
</div>

<!-- Top Bar -->
<div class="bg-cream-100 text-slate-700 py-2 hidden md:block border-b border-cream-200/50">
  <div class="container mx-auto px-6 flex justify-between items-center">
    <!-- Contact Info -->
    <div class="flex items-center space-x-6 space-x-reverse text-[12px] font-medium tracking-wide">
      <div class="flex items-center group cursor-pointer">
        <div
          class="w-7 h-7 rounded-full bg-cream-50 flex items-center justify-center ml-2 group-hover:bg-cream-200 transition-colors"
        >
          <i class="fas fa-mobile-alt text-emerald-700 text-[10px]"></i>
        </div>
        <a href="tel:09183050600" dir="ltr" class="group-hover:text-emerald-700 transition-colors whitespace-nowrap text-slate-700"
          >0918 305 0600</a
        >
      </div>
      <div class="flex items-center group cursor-pointer">
        <div
          class="w-7 h-7 rounded-full bg-cream-50 flex items-center justify-center ml-2 group-hover:bg-cream-200 transition-colors"
        >
          <i class="fas fa-phone-alt text-emerald-700 text-[10px]"></i>
        </div>
        <a href="tel:09183159274" dir="ltr" class="group-hover:text-emerald-700 transition-colors whitespace-nowrap text-slate-700"
          >0918 315 9274</a
        >
      </div>
    </div>

    <!-- Social Media -->
    <div class="flex items-center gap-2">
      <a
        *ngFor="let item of footerData?.social"
        [href]="item.link"
        target="_blank"
        class="w-8 h-8 rounded-full bg-cream-50 border border-cream-200 flex items-center justify-center text-slate-600 hover:bg-emerald-700 hover:text-cream-50 transition-all duration-300 group/social shadow-xs"
      >
        <i
          [ngClass]="['fa-brands', 'fa-' + item.icon, 'text-sm']"
          class="transition-transform duration-500 group-hover/social:rotate-360 group-hover/social:scale-110 text-emerald-700 group-hover/social:text-cream-50"
        ></i>
      </a>
    </div>
  </div>
</div>

<!-- Main Header -->
<header class="bg-cream-50/95 backdrop-blur-md sticky top-0 z-40 shadow-xs border-b border-cream-100">
  <div class="container mx-auto px-6 py-4 flex justify-between items-center">
    <!-- Logo / Brand -->
    <div class="shrink-0">
      <a href="#home" class="flex items-center group gap-3">
        <div
          class="w-11 h-11 rounded-xl bg-emerald-700 flex items-center justify-center text-cream-50 shadow-md group-hover:scale-105 group-hover:bg-emerald-600 transition-transform duration-300 border border-amber-400"
        >
          <i class="fas fa-eye text-xl text-amber-300"></i>
        </div>
        <div class="flex flex-col whitespace-nowrap">
          <span class="text-[14px] sm:text-base font-bold text-emerald-900 leading-none"
            >مطب دکتر رکسانا حق پرست</span
          >
          <span class="text-[8px] font-semibold text-amber-600 tracking-[0.2em] mt-1 uppercase"
            >Ophthalmology Clinic</span
          >
        </div>
      </a>
    </div>

    <!-- Desktop Navigation -->
    <nav class="hidden xl:flex items-center space-x-1 space-x-reverse flex-nowrap whitespace-nowrap">
      <a
        href="#home"
        class="group relative px-3 py-2 text-sm font-semibold text-slate-700 hover:text-emerald-800 transition-colors duration-200 whitespace-nowrap"
      >
        صفحه اصلی
        <span
          class="absolute bottom-1 right-3 left-3 h-0.5 bg-amber-500 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-right"
        ></span>
      </a>
      <a
        href="#services"
        class="group relative px-3 py-2 text-sm font-semibold text-slate-700 hover:text-emerald-800 transition-colors duration-200 whitespace-nowrap"
      >
        خدمات
        <span
          class="absolute bottom-1 right-3 left-3 h-0.5 bg-amber-500 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-right"
        ></span>
      </a>
      <a
        href="#education"
        class="group relative px-3 py-2 text-sm font-semibold text-slate-700 hover:text-emerald-800 transition-colors duration-200 whitespace-nowrap"
      >
        آموزش و سلامت
        <span
          class="absolute bottom-1 right-3 left-3 h-0.5 bg-amber-500 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-right"
        ></span>
      </a>
      <a
        href="#gallery"
        class="group relative px-3 py-2 text-sm font-semibold text-slate-700 hover:text-emerald-800 transition-colors duration-200 whitespace-nowrap"
      >
      گالری
        <span
          class="absolute bottom-1 right-3 left-3 h-0.5 bg-amber-500 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-right"
        ></span>
      </a>
            <a
        href="#articles"
        class="group relative px-3 py-2 text-sm font-semibold text-slate-700 hover:text-emerald-800 transition-colors duration-200 whitespace-nowrap"
      >
      مقالات
        <span
          class="absolute bottom-1 right-3 left-3 h-0.5 bg-amber-500 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-right"
        ></span>
      </a>
      <a
        href="#doctorProfile"
        class="group relative px-3 py-2 text-sm font-semibold text-slate-700 hover:text-emerald-800 transition-colors duration-200 whitespace-nowrap"
      >
        درباره ما
        <span
          class="absolute bottom-1 right-3 left-3 h-0.5 bg-amber-500 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-right"
        ></span>
      </a>
      <a
        href="#footer"
        class="group relative px-3 py-2 text-sm font-semibold text-slate-700 hover:text-emerald-800 transition-colors duration-200 whitespace-nowrap"
      >
        تماس با ما
        <span
          class="absolute bottom-1 right-3 left-3 h-0.5 bg-amber-500 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-right"
        ></span>
      </a>
    </nav>

    <!-- Appointment Button & Mobile Toggle -->
    <div class="flex items-center space-x-3 space-x-reverse">
      <div
        class="hidden lg:flex items-center gap-3 bg-emerald-800 text-cream-50 px-5 py-2.5 rounded-xl hover:bg-emerald-700 transition-all shadow-md group whitespace-nowrap border border-amber-500/30"
      >
        <div
          class="w-8 h-8 rounded-lg bg-emerald-900 flex items-center justify-center group-hover:bg-emerald-800 transition-colors"
        >
          <i class="fas fa-calendar-alt text-amber-300 text-sm"></i>
        </div>
        <div class="flex flex-col items-start">
          <span class="text-[9px] font-semibold text-amber-300 mb-0.5">دریافت نوبت</span>
          <div class="flex items-center gap-2 text-[12px] font-semibold leading-tight">
            <a
              href="tel:09183050600"
              dir="ltr"
              class="hover:text-amber-300 transition-colors whitespace-nowrap"
              >0918 305 0600</a
            >
            <div class="w-px h-3 bg-white/20"></div>
            <a
              href="tel:09183159274"
              dir="ltr"
              class="hover:text-amber-300 transition-colors whitespace-nowrap"
              >0918 315 9274</a
            >
          </div>
        </div>
      </div>

      <!-- Mobile Menu Button -->
      <button
        (click)="toggleMenu()"
        class="xl:hidden text-emerald-800 hover:text-emerald-700 focus:outline-none p-2 rounded-xl bg-cream-100 border border-cream-200 transition-all active:scale-90"
      >
        <i [class]="isMenuOpen ? 'fas fa-times text-lg' : 'fas fa-bars-staggered text-lg'"></i>
      </button>
    </div>
  </div>
</header>
