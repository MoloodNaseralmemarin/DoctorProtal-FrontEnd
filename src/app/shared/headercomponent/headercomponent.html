<!-- Full-screen Mobile Navigation -->
<div
  *ngIf="isMenuOpen"
  class="fixed inset-0 bg-cream-50 z-9999 flex flex-col md:hidden animate-in fade-in duration-300"
>
  <div class="flex flex-col h-full pt-24 px-10 overflow-y-auto bg-cream-50">
    <!-- Close Button -->
    <button
      (click)="toggleMenu()"
      class="absolute top-6 left-6 p-3 bg-emerald-50 rounded-2xl text-emerald-700 hover:bg-emerald-100 transition-all active:scale-90"
    >
      <i class="fas fa-times text-2xl"></i>
    </button>

    <div class="flex flex-col space-y-6">
      <a
        href="#home"
        (click)="toggleMenu()"
        class="text-2xl font-bold text-emerald-900 hover:text-emerald-600 transition-colors flex justify-between items-center py-4 border-b border-emerald-100/50"
      >
        صفحه اصلی
        <i class="fas fa-chevron-left text-sm opacity-30"></i>
      </a>
      <a
        href="#services"
        (click)="toggleMenu()"
        class="text-2xl font-bold text-emerald-900 hover:text-emerald-600 transition-colors flex justify-between items-center py-4 border-b border-emerald-100/50"
      >
        خدمات
        <i class="fas fa-chevron-left text-sm opacity-30"></i>
      </a>
      <a
        href="#education"
        (click)="toggleMenu()"
        class="text-2xl font-bold text-emerald-900 hover:text-emerald-600 transition-colors flex justify-between items-center py-4 border-b border-emerald-100/50"
      >
        آموزش و سلامت
        <i class="fas fa-chevron-left text-sm opacity-30"></i>
      </a>
        <a
        href="#gallery"
        (click)="toggleMenu()"
        class="text-2xl font-bold text-emerald-900 hover:text-emerald-600 transition-colors flex justify-between items-center py-4 border-b border-emerald-100/50"
      >
        گالری
        <i class="fas fa-chevron-left text-sm opacity-30"></i>
      </a>
      <a
        href="#articles"
        (click)="toggleMenu()"
        class="text-2xl font-bold text-emerald-900 hover:text-emerald-600 transition-colors flex justify-between items-center py-4 border-b border-emerald-100/50"
      >
        مقالات
        <i class="fas fa-chevron-left text-sm opacity-30"></i>
      </a>
      <a
        href="#doctorProfile"
        (click)="toggleMenu()"
        class="text-2xl font-bold text-emerald-900 hover:text-emerald-600 transition-colors flex justify-between items-center py-4 border-b border-emerald-100/50"
      >
        درباره ما
        <i class="fas fa-chevron-left text-sm opacity-30"></i>
      </a>
      <a
        href="#footer"
        (click)="toggleMenu()"
        class="text-2xl font-bold text-emerald-900 hover:text-emerald-600 transition-colors flex justify-between items-center py-4 border-b border-emerald-100/50"
      >
        تماس با ما
        <i class="fas fa-chevron-left text-sm opacity-30"></i>
      </a>
    </div>

    <div class="mt-auto py-12 space-y-10">
      <div class="pt-8 border-t border-emerald-100/50">
        <div
          class="w-full bg-emerald-900 text-cream-50 px-6 py-5 rounded-3xl text-center shadow-xl shadow-emerald-900/10"
        >
          <span class="text-sm opacity-80 block mb-2">جهت دریافت نوبت:</span>
          <div
            class="flex items-center justify-center gap-x-3 font-black text-[15px] tracking-tight"
          >
            <a href="tel:09183050600" dir="ltr" class="whitespace-nowrap">0918 305 0600</a>
            <span class="opacity-30 text-xs">|</span>
            <a href="tel:09183159274" dir="ltr" class="whitespace-nowrap">0918 315 9274</a>
          </div>
        </div>
      </div>

      <div class="flex justify-center gap-6 pb-10">
        <a
          *ngFor="let item of footerData?.social"
          [href]="item.link"
          class="w-14 h-14 rounded-2xl bg-emerald-100/50 flex items-center justify-center text-emerald-800 hover:bg-emerald-900 hover:text-cream-50 hover:shadow-lg hover:shadow-emerald-900/20 transition-all duration-500"
        >
          <i [ngClass]="['fa-brands', 'fa-' + item.icon, 'text-2xl']"></i>
        </a>
      </div>
    </div>
  </div>
</div>

<!-- Top Bar -->
<div class="bg-cream-100/50 text-emerald-800 py-2 hidden md:block border-b border-emerald-100/30">
  <div class="container mx-auto px-6 flex justify-between items-center">
    <!-- Contact Info -->
    <div class="flex items-center space-x-8 space-x-reverse text-[12px] font-medium tracking-wide">
      <div class="flex items-center group cursor-pointer">
        <div
          class="w-7 h-7 rounded-full bg-emerald-100 flex items-center justify-center ml-2 group-hover:bg-emerald-200 transition-colors"
        >
          <i class="fas fa-mobile-alt text-emerald-700 text-[10px]"></i>
        </div>
        <a href="tel:09183050600" dir="ltr" class="group-hover:text-emerald-600 transition-colors"
          >0918 305 0600</a
        >
      </div>
      <div class="flex items-center group cursor-pointer">
        <div
          class="w-7 h-7 rounded-full bg-emerald-100 flex items-center justify-center ml-2 group-hover:bg-emerald-200 transition-colors"
        >
          <i class="fas fa-phone-alt text-emerald-700 text-[10px]"></i>
        </div>
        <a href="tel:09183159274" dir="ltr" class="group-hover:text-emerald-600 transition-colors"
          >0918 305 0600</a
        >
      </div>
    </div>

    <!-- Social Media -->
    <div class="flex items-center gap-3">
      <a
        *ngFor="let item of footerData?.social"
        [href]="item.link"
        target="_blank"
        class="w-10 h-10 rounded-full bg-emerald-800/5 flex items-center justify-center text-emerald-700 hover:bg-emerald-900 hover:text-cream-50 transition-all duration-500 group/social shadow-sm shadow-emerald-900/5"
      >
        <i
          [ngClass]="['fa-brands', 'fa-' + item.icon, 'text-base']"
          class="transition-transform duration-500 group-hover/social:rotate-360 group-hover/social:scale-110"
        ></i>
      </a>
    </div>
  </div>
</div>

<!-- Main Header -->
<header class="bg-white/95 backdrop-blur-md sticky top-0 z-40 shadow-sm border-b border-emerald-50">
  <div class="container mx-auto px-6 py-4 flex justify-between items-center">
    <!-- Logo / Brand -->
    <div class="shrink-0">
      <a href="#home" class="flex items-center group gap-3">
        <div
          class="w-12 h-12 rounded-2xl bg-emerald-900 flex items-center justify-center text-cream-50 shadow-lg shadow-emerald-900/20 group-hover:scale-105 transition-transform duration-300"
        >
          <i class="fas fa-eye text-2xl"></i>
        </div>
        <div class="flex flex-col">
          <span class="text-[15px] sm:text-lg font-black text-emerald-950 leading-none"
            >مطب دکتر رکسانا حق پرست</span
          >
          <span class="text-[9px] font-bold text-emerald-600 tracking-[0.2em] mt-1 uppercase"
            >Ophthalmology Clinic</span
          >
        </div>
      </a>
    </div>

    <!-- Desktop Navigation -->
    <nav class="hidden md:flex items-center space-x-2 space-x-reverse">
      <a
        href="#home"
        class="group relative px-4 py-2 text-[15px] font-medium text-emerald-900/70 hover:text-emerald-950 transition-colors duration-200"
      >
        صفحه اصلی
        <span
          class="absolute bottom-1 right-4 left-4 h-0.5 bg-emerald-500 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-right"
        ></span>
      </a>
      <a
        href="#servcies"
        class="group relative px-4 py-2 text-[15px] font-medium text-emerald-900/70 hover:text-emerald-950 transition-colors duration-200"
      >
        خدمات
        <span
          class="absolute bottom-1 right-4 left-4 h-0.5 bg-emerald-500 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-right"
        ></span>
      </a>
      <a
        href="#education"
        class="group relative px-4 py-2 text-[15px] font-medium text-emerald-900/70 hover:text-emerald-950 transition-colors duration-200"
      >
        آموزش و سلامت
        <span
          class="absolute bottom-1 right-4 left-4 h-0.5 bg-emerald-500 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-right"
        ></span>
      </a>
      <a
        href="#gallery"
        class="group relative px-4 py-2 text-[15px] font-medium text-emerald-900/70 hover:text-emerald-950 transition-colors duration-200"
      >
      گالری
        <span
          class="absolute bottom-1 right-4 left-4 h-0.5 bg-emerald-500 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-right"
        ></span>
      </a>
            <a
        href="#articles"
        class="group relative px-4 py-2 text-[15px] font-medium text-emerald-900/70 hover:text-emerald-950 transition-colors duration-200"
      >
      مقالات
        <span
          class="absolute bottom-1 right-4 left-4 h-0.5 bg-emerald-500 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-right"
        ></span>
      </a>
      <a
        href="#doctorProfile"
        class="group relative px-4 py-2 text-[15px] font-medium text-emerald-900/70 hover:text-emerald-950 transition-colors duration-200"
      >
        درباره ما
        <span
          class="absolute bottom-1 right-4 left-4 h-0.5 bg-emerald-500 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-right"
        ></span>
      </a>
      <a
        href="#footer"
        class="group relative px-4 py-2 text-[15px] font-medium text-emerald-900/70 hover:text-emerald-950 transition-colors duration-200"
      >
        تماس با ما
        <span
          class="absolute bottom-1 right-4 left-4 h-0.5 bg-emerald-500 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-right"
        ></span>
      </a>
    </nav>

    <!-- Appointment Button & Mobile Toggle -->
    <div class="flex items-center space-x-4 space-x-reverse">
      <div
        class="hidden lg:flex items-center gap-4 bg-emerald-900 text-cream-50 px-6 py-3 rounded-2xl transition-all shadow-lg shadow-emerald-900/10 group"
      >
        <div
          class="w-10 h-10 rounded-xl bg-emerald-800 flex items-center justify-center group-hover:bg-emerald-700 transition-colors"
        >
          <i class="fas fa-calendar-alt text-emerald-300 text-lg"></i>
        </div>
        <div class="flex flex-col items-start">
          <span class="text-[10px] font-bold text-emerald-300 mb-1">دریافت نوبت</span>
          <div class="flex items-center gap-3 text-[13px] font-black leading-tight">
            <a
              href="tel:09183050600"
              dir="ltr"
              class="hover:text-white transition-colors whitespace-nowrap"
              >0918 305 0600</a
            >
            <div class="w-px h-3 bg-white/20"></div>
            <a
              href="tel:09183159274"
              dir="ltr"
              class="hover:text-white transition-colors whitespace-nowrap"
              >0918 305 0600</a
            >
          </div>
        </div>
      </div>

      <!-- Mobile Menu Button -->
      <button
        (click)="toggleMenu()"
        class="md:hidden text-emerald-800 hover:text-emerald-600 focus:outline-none p-3 rounded-2xl bg-emerald-50 transition-all active:scale-90"
      >
        <i [class]="isMenuOpen ? 'fas fa-times text-xl' : 'fas fa-bars-staggered text-xl'"></i>
      </button>
    </div>
  </div>
</header>
