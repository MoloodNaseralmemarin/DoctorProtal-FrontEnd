<section class="py-20 bg-amber-50 border-y border-gray-200" dir="rtl" id="gallery">
  <div class="container mx-auto px-6">
    <h2 class="text-4xl font-bold text-center text-blue-950 mb-16">
      گالری تصاویر و ویدئوها
    </h2>

    <!-- Skeleton Loading -->
    <div *ngIf="images.length === 0" class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <div *ngFor="let item of [1,2,3,4,5,6]" class="animate-pulse">
        <div class="bg-gray-300 aspect-video rounded-2xl mb-4"></div>
        <div class="h-4 bg-gray-300 rounded w-3/4 mx-auto"></div>
      </div>
    </div>

    <!-- Gallery Grid -->
    <ul *ngIf="images.length > 0" class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <li *ngFor="let image of images">
        <button (click)="openModal(image)"
                class="group relative block w-full aspect-video rounded-2xl overflow-hidden shadow-lg hover:shadow-2xl transition-all duration-500">

          <img [src]="image.imageUrl"
               class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
               [alt]="image.title">

          <!-- Hover Overlay -->
          <div class="absolute inset-0 bg-linear-to-t from-blue-950/90 via-blue-950/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex flex-col justify-end p-6">
            <h3 class="text-white text-lg font-medium translate-y-4 group-hover:translate-y-0 transition-transform duration-500">
              {{ image.title }}
            </h3>
            <div class="mt-2 w-12 h-1 bg-green-500 rounded-full translate-y-4 group-hover:translate-y-0 transition-transform duration-500 delay-75"></div>
          </div>

          <!-- Quick Look Icon (Optional but nice for UX) -->
          <div class="absolute top-4 left-4 bg-white/20 backdrop-blur-md rounded-full p-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
            <i class="fas fa-search-plus text-white"></i>
          </div>
        </button>
      </li>
    </ul>

    <!-- Pagination -->
    <div *ngIf="totalPages > 1" class="flex justify-center items-center mt-16 gap-3">
      <button *ngFor="let page of [].constructor(totalPages); let i = index"
              (click)="changePage(i+1)"
              class="w-12 h-12 flex items-center justify-center rounded-xl font-bold transition-all duration-300 border-2"
              [class.bg-green-600]="currentPage === i+1"
              [class.border-green-600]="currentPage === i+1"
              [class.text-white]="currentPage === i+1"
              [class.border-blue-950]="currentPage !== i+1"
              [class.text-blue-950]="currentPage !== i+1"
              [class.hover:bg-blue-50]="currentPage !== i+1">
        {{ i+1 }}
      </button>
    </div>
  </div>
</section>

<!-- Improved Modal -->
<div *ngIf="selectedImage"
     (click)="closeModal()"
     class="fixed inset-0 bg-blue-950/80 backdrop-blur-md flex items-center justify-center z-100 transition-all duration-300 p-4">

  <div class="relative max-w-5xl w-full" (click)="$event.stopPropagation()">
    <!-- Close Button -->
    <button (click)="closeModal()"
            class="absolute -top-16 left-0 text-white hover:text-green-400 bg-white/10 hover:bg-white/20 rounded-full p-3 transition-all duration-300 flex items-center justify-center w-12 h-12 z-110">
      <i class="fas fa-times text-xl"></i>
    </button>

    <!-- Navigation Buttons -->
    <button (click)="prevImage()"
            class="absolute top-1/2 -right-20 -translate-y-1/2 text-white hover:text-green-400 bg-white/10 hover:bg-white/20 rounded-full p-4 transition-all duration-300 hidden md:flex items-center justify-center w-14 h-14 z-110">
      <i class="fas fa-chevron-right text-2xl"></i>
    </button>

    <button (click)="nextImage()"
            class="absolute top-1/2 -left-20 -translate-y-1/2 text-white hover:text-green-400 bg-white/10 hover:bg-white/20 rounded-full p-4 transition-all duration-300 hidden md:flex items-center justify-center w-14 h-14 z-110">
      <i class="fas fa-chevron-left text-2xl"></i>
    </button>

    <!-- Modal Content -->
    <div class="bg-white rounded-3xl overflow-hidden shadow-2xl">
      <img [src]="selectedImage.imageUrl"
           class="w-full h-auto max-h-[80vh] object-contain mx-auto"
           [alt]="selectedImage.title">

      <div class="p-6 bg-white border-t border-gray-100 text-center">
        <h3 class="text-2xl font-bold text-blue-950">{{ selectedImage.title }}</h3>
      </div>
    </div>
  </div>
</div>
