<section class="py-16 bg-cream-50 border-y border-cream-200/60" dir="rtl" id="gallery">
  <div class="container mx-auto px-6">
    <h2 class="text-xl md:text-2xl font-bold text-center text-slate-900 mb-8">
      گالری تصاویر و ویدئوها
    </h2>

    <!-- Skeleton Loading -->
    <div *ngIf="images.length === 0" class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <div *ngFor="let item of [1,2,3,4,5,6]" class="animate-pulse">
        <div class="bg-cream-100 border border-cream-200 aspect-video rounded-xl mb-4"></div>
        <div class="h-4 bg-cream-200 rounded w-3/4 mx-auto"></div>
      </div>
    </div>

    <!-- Gallery Grid -->
    <ul *ngIf="images.length > 0" class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <li *ngFor="let image of images">
        <button (click)="openModal(image)"
                class="group relative block w-full aspect-video rounded-2xl overflow-hidden shadow-md hover:shadow-xl border-2 border-cream-100 transition-all duration-500">

          <img [src]="image.imageUrl"
               class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
               [alt]="image.title">

          <!-- Hover Overlay -->
          <div class="absolute inset-0 bg-linear-to-t from-emerald-950/95 via-emerald-950/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex flex-col justify-end p-6">
            <h3 class="text-cream-50 text-base md:text-lg font-bold translate-y-4 group-hover:translate-y-0 transition-transform duration-500">
              {{ image.title }}
            </h3>
            <div class="mt-2 w-12 h-0.5 bg-amber-500 rounded-full translate-y-4 group-hover:translate-y-0 transition-transform duration-500 delay-75"></div>
          </div>

          <!-- Quick Look Icon -->
          <div class="absolute top-4 left-4 bg-emerald-800/20 backdrop-blur-md rounded-full p-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 border border-amber-500/20">
            <i class="fas fa-search-plus text-white text-sm"></i>
          </div>
        </button>
      </li>
    </ul>

    <!-- Pagination -->
    <div *ngIf="totalPages > 1" class="flex justify-center items-center mt-12 gap-2">
      <button *ngFor="let page of [].constructor(totalPages); let i = index"
              (click)="changePage(i+1)"
              class="w-10 h-10 flex items-center justify-center rounded-xl font-bold transition-all duration-300 border"
              [class.bg-emerald-800]="currentPage === i+1"
              [class.border-emerald-700]="currentPage === i+1"
              [class.text-white]="currentPage === i+1"
              [class.border-cream-200]="currentPage !== i+1"
              [class.text-emerald-900]="currentPage !== i+1"
              [class.bg-cream-50]="currentPage !== i+1"
              [class.hover:bg-cream-100]="currentPage !== i+1">
        {{ i+1 }}
      </button>
    </div>
  </div>
</section>

<!-- Improved Modal -->
<div *ngIf="selectedImage"
     (click)="closeModal()"
     class="fixed inset-0 bg-emerald-950/80 backdrop-blur-md flex items-center justify-center z-100 transition-all duration-300 p-4">

  <div class="relative max-w-4xl w-full" (click)="$event.stopPropagation()">
    <!-- Close Button -->
    <button (click)="closeModal()"
            class="absolute -top-14 left-0 text-white hover:text-amber-300 bg-white/10 hover:bg-white/20 rounded-full p-2.5 transition-all duration-300 flex items-center justify-center w-10 h-10 z-110">
      <i class="fas fa-times text-lg"></i>
    </button>

    <!-- Navigation Buttons -->
    <button (click)="prevImage()"
            class="absolute top-1/2 -right-16 -translate-y-1/2 text-white hover:text-amber-300 bg-white/10 hover:bg-white/20 rounded-full p-3 transition-all duration-300 hidden md:flex items-center justify-center w-12 h-12 z-110">
      <i class="fas fa-chevron-right text-xl"></i>
    </button>

    <button (click)="nextImage()"
            class="absolute top-1/2 -left-16 -translate-y-1/2 text-white hover:text-amber-300 bg-white/10 hover:bg-white/20 rounded-full p-3 transition-all duration-300 hidden md:flex items-center justify-center w-12 h-12 z-110">
      <i class="fas fa-chevron-left text-xl"></i>
    </button>

    <!-- Modal Content -->
    <div class="bg-cream-50 rounded-2xl overflow-hidden shadow-2xl border-4 border-cream-100">
      <img [src]="selectedImage.imageUrl"
           class="w-full h-auto max-h-[75vh] object-contain mx-auto"
           [alt]="selectedImage.title">

      <div class="p-5 bg-cream-50 border-t border-cream-200 text-center">
        <h3 class="text-xl font-bold text-emerald-900">{{ selectedImage.title }}</h3>
      </div>
    </div>
  </div>
</div>
