@if (doctor) {
  <section class="relative bg-white pt-12 pb-16 md:pt-16 md:pb-24 overflow-hidden" dir="rtl" id="doctorProfile">
    <!-- Soft Decorative Background -->
    <div
      class="absolute top-0 left-0 w-150 h-150 bg-slate-50 rounded-full blur-[120px] -translate-x-1/2 -translate-y-1/2 pointer-events-none"
    ></div>
    <div
      class="absolute bottom-0 right-0 w-100 h-100 bg-slate-50 rounded-full blur-[100px] translate-x-1/3 translate-y-1/3 pointer-events-none"
    ></div>

    <div class="container mx-auto px-6 relative z-10">
      <div class="max-w-6xl mx-auto">
        <div class="flex flex-col lg:flex-row items-center gap-10 lg:gap-14">
          <!-- Image Section -->
          <div class="w-full lg:w-1/2 flex justify-center">
            <div class="relative group">
              <!-- Outer Luxury Layers (Glow & Borders) -->
              <div
                class="absolute -inset-10 border border-slate-200/20 rounded-[5rem] transition-all duration-1000 group-hover:-inset-12 group-hover:border-slate-300/30 group-hover:-rotate-3"
              ></div>
              <div
                class="absolute -inset-6 border-2 border-slate-200/40 rounded-[4.5rem] transition-all duration-700 group-hover:-inset-4 group-hover:border-slate-300/60 group-hover:rotate-2 group-hover:shadow-[0_0_50px_-10px_rgba(15,23,42,0.05)]"
              ></div>

              <!-- Main Image Container -->
              <div
                class="relative w-full max-w-125 aspect-4/5 rounded-[3.5rem] overflow-hidden shadow-[0_32px_64px_-16px_rgba(15,23,42,0.15)] ring-10 ring-white z-10 border-[3px] border-slate-300 group-hover:border-slate-400 transition-colors duration-500"
              >
                @if (doctor.imageUrl) {
                  <img
                    [src]="doctorImagePath + doctor.imageUrl"
                    [alt]="doctor.fullName"
                    class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110"
                  />
                } @else {
                  <div class="w-full h-full flex items-center justify-center bg-slate-50">
                    <i class="fas fa-user-md text-6xl text-slate-200"></i>
                  </div>
                }
              </div>

              <!-- Floating Experience Badge -->
              <div
                class="absolute -bottom-6 -right-6 lg:-right-10 bg-white p-5 rounded-[2.5rem] shadow-2xl shadow-slate-900/10 flex items-center gap-4 z-20 border border-slate-100 animate-bounce-slow"
              >
                <div
                  class="w-14 h-14 rounded-2xl bg-slate-900 flex items-center justify-center text-emerald-400 shadow-lg shadow-slate-900/10 border border-slate-800"
                >
                  <i class="fas fa-certificate text-xl"></i>
                </div>
                <div class="pe-4">
                  <p
                    class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em] mb-0.5"
                  >
                    Experience & Skills
                  </p>
                  <p class="text-slate-900 font-extrabold text-base">{{ doctor.specialty}}</p>
                </div>
              </div>

              <!-- Extra Decorative Accents -->
              <div
                class="absolute -top-8 -left-8 w-16 h-16 bg-slate-50 rounded-full opacity-50 blur-sm group-hover:scale-150 transition-transform duration-700"
              ></div>
            </div>
          </div>

          <!-- Content Section -->
          <div class="w-full lg:w-1/2 text-right lg:pe-6">
            <h2
              class="text-3xl md:text-4xl font-extrabold bg-linear-to-l from-slate-900 to-slate-700 bg-clip-text text-transparent mb-6 leading-tight tracking-tight"
            >
              {{ doctor.fullName }}
            </h2>

            <div class="relative mb-10">
              <p
                class="text-base md:text-[17px] text-slate-600 leading-[2] text-justify whitespace-pre-line ps-8 border-r-4 border-slate-300"
              >
                {{ doctor.clinicInfo }}
              </p>
            </div>

            <!-- Features Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div
                class="p-8 bg-slate-50/50 rounded-[2.5rem] border border-slate-100 shadow-xs group/card hover:bg-slate-900 hover:border-transparent transition-all duration-500"
              >
                <div
                  class="w-14 h-14 rounded-2xl bg-white flex items-center justify-center text-slate-700 mb-6 group-hover/card:bg-slate-800 group-hover/card:text-emerald-400 transition-all duration-500 shadow-xs"
                >
                  <i class="fas fa-graduation-cap text-xl"></i>
                </div>
                <h4 class="font-bold text-slate-900 text-[17px] mb-2 group-hover/card:text-white">
                  تحصیلات
                </h4>
                <p
                  class="text-[14px] text-slate-500 leading-relaxed font-medium group-hover/card:text-slate-300"
                >
                  {{ doctor.education }}
                </p>
              </div>

              <div
                class="p-8 bg-slate-50/50 rounded-[2.5rem] border border-slate-100 shadow-xs group/card hover:bg-slate-900 hover:border-transparent transition-all duration-500"
              >
                <div
                  class="w-14 h-14 rounded-2xl bg-white flex items-center justify-center text-slate-700 mb-6 group-hover/card:bg-slate-800 group-hover/card:text-emerald-400 transition-all duration-500 shadow-xs"
                >
                  <i class="fas fa-stethoscope text-xl"></i>
                </div>
                <h4 class="font-bold text-slate-900 text-[17px] mb-2 group-hover/card:text-white">
                  خدمات نوین
                </h4>
                <p
                  class="text-[14px] text-slate-500 leading-relaxed font-medium group-hover/card:text-slate-300"
                >
                  {{ doctor.services }}
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
}
