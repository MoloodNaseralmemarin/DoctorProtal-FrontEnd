@if (doctor) {
  <section class="relative bg-white pt-12 pb-16 md:pt-16 md:pb-24 overflow-hidden" dir="rtl" id="doctorProfile">
    <!-- Soft Decorative Background -->
    <div
      class="absolute top-0 left-0 w-150 h-150 bg-emerald-50/30 rounded-full blur-[120px] -translate-x-1/2 -translate-y-1/2 pointer-events-none"
    ></div>
    <div
      class="absolute bottom-0 right-0 w-100 h-100 bg-emerald-50/40 rounded-full blur-[100px] translate-x-1/3 translate-y-1/3 pointer-events-none"
    ></div>

    <div class="container mx-auto px-6 relative z-10">
      <div class="max-w-6xl mx-auto">
        <div class="flex flex-col lg:flex-row items-center gap-10 lg:gap-14">
          <!-- Image Section -->
          <div class="w-full lg:w-1/2 flex justify-center">
            <div class="relative group">
              <!-- Outer Luxury Layers (Glow & Borders) -->
              <div
                class="absolute -inset-10 border border-emerald-500/5 rounded-[5rem] transition-all duration-1000 group-hover:-inset-12 group-hover:border-emerald-500/10 group-hover:-rotate-3"
              ></div>
              <div
                class="absolute -inset-6 border-2 border-emerald-500/10 rounded-[4.5rem] transition-all duration-700 group-hover:-inset-4 group-hover:border-emerald-500/25 group-hover:rotate-2 group-hover:shadow-[0_0_50px_-10px_rgba(16,185,129,0.15)]"
              ></div>

              <!-- Main Image Container -->
              <div
                class="relative w-full max-w-125 aspect-4/5 rounded-[3.5rem] overflow-hidden shadow-[0_32px_64px_-16px_rgba(6,78,59,0.2)] ring-10 ring-white z-10 border-[3px] border-emerald-800/80 group-hover:border-emerald-500/50 transition-colors duration-500"
              >
                @if (doctor.imageUrl) {
                  <img
                    [src]="doctor.imageUrl"
                    [alt]="doctor.fullName"
                    class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110"
                  />
                } @else {
                  <div class="w-full h-full flex items-center justify-center bg-emerald-50">
                    <i class="fas fa-user-md text-6xl text-emerald-100"></i>
                  </div>
                }
              </div>

              <!-- Floating Experience Badge -->
              <div
                class="absolute -bottom-6 -right-6 lg:-right-10 bg-white p-5 rounded-[2.5rem] shadow-2xl shadow-emerald-900/10 flex items-center gap-4 z-20 border border-emerald-100 animate-bounce-slow"
              >
                <div
                  class="w-14 h-14 rounded-2xl bg-emerald-950 flex items-center justify-center text-emerald-400 shadow-lg shadow-emerald-900/10 border border-emerald-500/20"
                >
                  <i class="fas fa-certificate text-xl"></i>
                </div>
                <div class="pe-4">
                  <p
                    class="text-emerald-600 text-[10px] font-black uppercase tracking-[0.2em] mb-0.5"
                  >
                    Experience & Skills
                  </p>
                  <p class="text-emerald-950 font-black text-lg">{{ doctor.specialty }}</p>
                </div>
              </div>

              <!-- Extra Decorative Accents -->
              <div
                class="absolute -top-8 -left-8 w-16 h-16 bg-emerald-50 rounded-full opacity-50 blur-sm group-hover:scale-150 transition-transform duration-700"
              ></div>
            </div>
          </div>

          <!-- Content Section -->
          <div class="w-full lg:w-1/2 text-right lg:pe-6">
            <h2
              class="text-4xl md:text-5xl font-black bg-linear-to-l from-emerald-900 to-emerald-700 bg-clip-text text-transparent mb-6 leading-tight tracking-tight"
            >
              {{ doctor.fullName }}
            </h2>

            <div class="relative mb-10">
              <p
                class="text-lg md:text-xl text-emerald-900/80 leading-[2.3] text-justify whitespace-pre-line ps-8 border-r-4 border-emerald-500/30"
              >
                {{ doctor.clinicInfo }}
              </p>
            </div>

            <!-- Features Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div
                class="p-8 bg-emerald-50/50 rounded-[2.5rem] border border-emerald-100 shadow-sm group/card hover:bg-emerald-950 hover:border-transparent transition-all duration-500"
              >
                <div
                  class="w-14 h-14 rounded-2xl bg-white flex items-center justify-center text-emerald-600 mb-6 group-hover/card:bg-emerald-500 group-hover/card:text-white transition-all duration-500 shadow-sm"
                >
                  <i class="fas fa-graduation-cap text-xl"></i>
                </div>
                <h4 class="font-black text-emerald-950 text-lg mb-2 group-hover/card:text-white">
                  تحصیلات
                </h4>
                <p
                  class="text-[15px] text-emerald-900/60 leading-relaxed font-medium group-hover/card:text-emerald-50/80"
                >
                  {{ doctor.education }}
                </p>
              </div>

              <div
                class="p-8 bg-emerald-50/50 rounded-[2.5rem] border border-emerald-100 shadow-sm group/card hover:bg-emerald-950 hover:border-transparent transition-all duration-500"
              >
                <div
                  class="w-14 h-14 rounded-2xl bg-white flex items-center justify-center text-emerald-600 mb-6 group-hover/card:bg-emerald-500 group-hover/card:text-white transition-all duration-500 shadow-sm"
                >
                  <i class="fas fa-stethoscope text-xl"></i>
                </div>
                <h4 class="font-black text-emerald-950 text-lg mb-2 group-hover/card:text-white">
                  خدمات نوین
                </h4>
                <p
                  class="text-[15px] text-emerald-900/60 leading-relaxed font-medium group-hover/card:text-emerald-50/80"
                >
                  {{ doctor.services }}
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
}
