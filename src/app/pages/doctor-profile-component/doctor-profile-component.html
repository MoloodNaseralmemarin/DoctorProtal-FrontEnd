@if (doctor) {
  <section class="relative bg-cream-50 pt-12 pb-16 md:pt-16 md:pb-24 overflow-hidden border-b border-cream-100" dir="rtl" id="doctorProfile">
    <!-- Soft Decorative Background -->
    <div
      class="absolute top-0 left-0 w-150 h-150 bg-emerald-100/30 rounded-full blur-[120px] -translate-x-1/2 -translate-y-1/2 pointer-events-none"
    ></div>
    <div
      class="absolute bottom-0 right-0 w-100 h-100 bg-amber-100/30 rounded-full blur-[100px] translate-x-1/3 translate-y-1/3 pointer-events-none"
    ></div>

    <div class="container mx-auto px-6 relative z-10">
      <div class="max-w-6xl mx-auto">
        <div class="flex flex-col lg:flex-row items-center gap-10 lg:gap-14">
          <!-- Image Section -->
          <div class="w-full lg:w-1/2 flex justify-center">
            <div class="relative group">
              <!-- Outer Luxury Layers (Glow & Borders) -->
              <div
                class="absolute -inset-10 border border-emerald-600/10 rounded-[5rem] transition-all duration-1000 group-hover:-inset-12 group-hover:border-emerald-600/25 group-hover:-rotate-3"
              ></div>
              <div
                class="absolute -inset-6 border-2 border-amber-500/20 rounded-[4.5rem] transition-all duration-700 group-hover:-inset-4 group-hover:border-amber-500/40 group-hover:rotate-2 group-hover:shadow-[0_0_50px_-10px_rgba(4,120,87,0.1)]"
              ></div>

              <!-- Main Image Container -->
              <div
                class="relative w-full max-w-125 aspect-4/5 rounded-[3.5rem] overflow-hidden shadow-[0_32px_64px_-16px_rgba(4,120,87,0.15)] ring-10 ring-cream-100 z-10 border-[3px] border-emerald-600 group-hover:border-amber-500 transition-colors duration-500"
              >
                @if (doctor.imageUrl) {
                  <img
                    [src]="doctorImagePath + doctor.imageUrl"
                    [alt]="doctor.fullName"
                    class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110"
                  />
                } @else {
                  <div class="w-full h-full flex items-center justify-center bg-cream-100">
                    <i class="fas fa-user-md text-6xl text-emerald-600/30"></i>
                  </div>
                }
              </div>

              <!-- Floating Experience Badge -->
              <div
                class="absolute -bottom-6 -right-6 lg:-right-10 bg-cream-50 p-5 rounded-[2.5rem] shadow-2xl shadow-emerald-900/10 flex items-center gap-4 z-20 border border-amber-500/30 animate-bounce-slow"
              >
                <div
                  class="w-14 h-14 rounded-2xl bg-emerald-800 flex items-center justify-center text-amber-300 shadow-lg border border-emerald-700"
                >
                  <i class="fas fa-certificate text-xl"></i>
                </div>
                <div class="pe-4">
                  <p
                    class="text-amber-600 text-[10px] font-bold uppercase tracking-[0.2em] mb-0.5"
                  >
                    بورد تخصصی ناسیونال
                  </p>
                  <p class="text-emerald-900 font-extrabold text-base">{{ doctor.specialty }}</p>

                </div>
              </div>

              <!-- Extra Decorative Accents -->
              <div
                class="absolute -top-8 -left-8 w-16 h-16 bg-amber-100/40 rounded-full opacity-50 blur-sm group-hover:scale-150 transition-transform duration-700"
              ></div>
            </div>
          </div>

          <!-- Content Section -->
          <div class="w-full lg:w-1/2 text-right lg:pe-6">

   <h2
  class="text-2xl md:text-3xl font-bold whitespace-nowrap bg-linear-to-l from-slate-900 to-slate-700 bg-clip-text text-transparent mb-6"
>
  {{ doctor.fullName }}
</h2>

           <div class="relative mb-10">
            <div
            class="text-base md:text-[17px] text-slate-600 leading-[2] text-justify ps-8 border-r-4 border-slate-300"
            [innerHTML]="doctor.clinicInfo">

            <h2
              class="text-xl md:text-2xl font-bold text-slate-900 mb-6 leading-tight tracking-tight flex items-center gap-2.5"
            >
              <i class="fas fa-user-doctor text-amber-500 text-xl md:text-2xl"></i>
              {{ doctor.fullName }}
            </h2>

            <div class="relative mb-8">
              <p
                class="text-sm md:text-base text-slate-700 leading-relaxed text-justify whitespace-pre-line ps-6 border-r-4 border-amber-500"
              >
                {{ doctor.clinicInfo }}
              </p>

            </div>
          </div>

            <!-- Features Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div
                class="p-6 bg-cream-100/70 rounded-2xl border border-cream-200 shadow-xs group/card hover:bg-emerald-850 hover:border-transparent transition-all duration-500"
              >
                <div
                  class="w-11 h-11 rounded-xl bg-cream-50 flex items-center justify-center text-slate-700 mb-4 group-hover/card:bg-emerald-750 group-hover/card:text-amber-300 transition-all duration-500 border border-cream-200"
                >
                  <i class="fas fa-graduation-cap text-lg"></i>
                </div>
                <h4 class="font-bold text-slate-800 text-[15px] mb-1.5 group-hover/card:text-white">
                  تحصیلات
                </h4>
                <p
                  class="text-xs text-slate-600 leading-relaxed font-medium group-hover/card:text-emerald-100"
                >
                  {{ doctor.education }}
                </p>
              </div>

              <div
                class="p-6 bg-cream-100/70 rounded-2xl border border-cream-200 shadow-xs group/card hover:bg-emerald-850 hover:border-transparent transition-all duration-500"
              >
                <div
                  class="w-11 h-11 rounded-xl bg-cream-50 flex items-center justify-center text-slate-700 mb-4 group-hover/card:bg-emerald-750 group-hover/card:text-amber-300 transition-all duration-500 border border-cream-200"
                >
                  <i class="fas fa-stethoscope text-lg"></i>
                </div>
                <h4 class="font-bold text-slate-800 text-[15px] mb-1.5 group-hover/card:text-white">
                  خدمات نوین
                </h4>
                <p
                  class="text-xs text-slate-600 leading-relaxed font-medium group-hover/card:text-emerald-100"
                >
                  {{ doctor.services }}
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
</div>
</section>
}
