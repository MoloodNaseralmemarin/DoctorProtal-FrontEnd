<div class="bg-cream-50 min-h-screen دلpb-24" dir="rtl">

  @if (tip$ | async; as tip) {
    <!-- Article Hero Section -->
    <section class="relative bg-emerald-950 py-24 overflow-hidden border-b border-cream-100">
      <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,var(--tw-gradient-from)_0%,transparent_70%)] from-amber-500"></div>
      <div class="absolute top-0 right-0 w-150 h-150 bg-emerald-900/40 rounded-full blur-[120px] -translate-y-1/2 translate-x-1/4"></div>

      <div class="container mx-auto px-6 relative z-10 text-center">
        <!-- Breadcrumbs -->
        <nav class="flex items-center justify-center gap-2 text-emerald-100 text-xs font-semibold tracking-wide mb-8">
          <a routerLink="/" class="hover:text-amber-300 transition-colors">صفحه اصلی</a>
          <i class="fas fa-chevron-left text-[8px] text-amber-500"></i>
          <span class="text-amber-200">جزییات راهنما</span>
        </nav>

        <h1 class="text-2xl md:text-4xl font-extrabold text-cream-50 mb-8 leading-tight max-w-4xl mx-auto">
          {{ tip.title }}
        </h1>

        <div class="flex items-center justify-center gap-6 text-emerald-200 text-xs font-medium">
          <div class="flex items-center gap-2">
            <i class="fas fa-calendar-alt text-amber-400"></i>
            <span>به‌روزرسانی شده در خرداد ۱۴۰۳</span>
          </div>
          <div class="flex items-center gap-2">
            <i class="fas fa-clock text-amber-400"></i>
            <span>زمان مطالعه: ۵ دقیقه</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Article Content -->
    <div class="container mx-auto px-6 -mt-12 relative z-20">
      <div class="max-w-4xl mx-auto">

        <div class="bg-cream-50 rounded-[3rem] shadow-xl border border-cream-200 p-8 md:p-16 relative overflow-hidden">

          <!-- Decorative Background Element -->
          <div class="absolute top-0 right-0 w-80 h-80 bg-cream-100 rounded-full -translate-y-1/2 translate-x-1/2 -z-10"></div>
          <!-- Content Body -->
          <div class="relative z-10">
            <p class="text-xl md:text-2xl text-emerald-950 font-extrabold leading-relaxed mb-8 text-justify">
              {{ tip.title }}
            </p>


            <div class="w-16 h-1 bg-slate-300 rounded-full mb-10"></div>
     <div
            class="text-base md:text-[17px] text-slate-600 leading-[2] text-justify ps-8 border-r-4 border-slate-300"
            [innerHTML]="tip.bodyText">
            </div>       </div>

          <!-- Actions -->
          <div class="mt-14 pt-10 border-t border-cream-200 flex flex-col md:flex-row items-center justify-center gap-6">
            <a routerLink="/" fragment="education" class="flex items-center gap-3 py-4 px-10 bg-emerald-800 text-cream-50 font-bold text-sm rounded-3xl hover:bg-emerald-700 hover:scale-[1.01] active:scale-95 border border-emerald-700 transition-all shadow-lg shadow-emerald-900/10 group">
              <i class="fas fa-arrow-right text-[10px] text-amber-300 transform group-hover:translate-x-2 transition-transform duration-300"></i>
              <span>بازگشت به صفحه اصلی</span>
            </a>
          </div>

        </div>

      </div>
    </div>
  } @else {
    <!-- Loading State -->
    <div class="flex flex-col items-center justify-center py-40 bg-cream-50">
      <div class="w-10 h-10 border-3 border-emerald-700 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="text-emerald-800 font-bold text-xs">در حال بارگذاری راهنما...</p>
    </div>
  }

</div>
