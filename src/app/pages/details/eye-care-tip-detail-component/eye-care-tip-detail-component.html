<div class="bg-slate-50/50 min-h-screen font-sans pb-24" dir="rtl">

  @if (tip$ | async; as tip) {
    <!-- Article Hero Section -->
    <section class="relative bg-slate-900 py-24 overflow-hidden">
      <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,var(--tw-gradient-from)_0%,transparent_70%)] from-slate-500"></div>
      <div class="absolute top-0 right-0 w-150 h-150 bg-slate-500/5 rounded-full blur-[120px] -translate-y-1/2 translate-x-1/4"></div>

      <div class="container mx-auto px-6 relative z-10 text-center">
        <!-- Breadcrumbs -->
        <nav class="flex items-center justify-center gap-2 text-slate-400 text-xs font-semibold tracking-wide mb-8">
          <a routerLink="/" class="hover:text-white transition-colors">صفحه اصلی</a>
          <i class="fas fa-chevron-left text-[8px]"></i>
          <span class="text-slate-300">جزییات راهنما</span>
        </nav>

        <h1 class="text-2xl md:text-4xl font-extrabold text-white mb-8 leading-tight max-w-4xl mx-auto">
          {{ tip.title }}
        </h1>

        <div class="flex items-center justify-center gap-6 text-slate-400 text-xs font-medium">
          <div class="flex items-center gap-2">
            <i class="fas fa-calendar-alt text-slate-500"></i>
            <span>به‌روزرسانی شده در خرداد ۱۴۰۳</span>
          </div>
          <div class="w-1 h-1 rounded-full bg-slate-600"></div>
          <div class="flex items-center gap-2">
            <i class="fas fa-clock text-slate-500"></i>
            <span>زمان مطالعه: ۵ دقیقه</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Article Content -->
    <div class="container mx-auto px-6 -mt-12 relative z-20">
      <div class="max-w-4xl mx-auto">

        <div class="bg-white rounded-[3rem] shadow-xl border border-slate-100 p-8 md:p-16 relative overflow-hidden">

          <!-- Decorative Background Element -->
          <div class="absolute top-0 right-0 w-80 h-80 bg-slate-50 rounded-full -translate-y-1/2 translate-x-1/2 -z-10"></div>

          <!-- Decorative Icon -->
          <div class="flex justify-center -mt-24 md:-mt-32 mb-12 relative z-10">
            <div class="w-24 h-24 rounded-2xl bg-white shadow-lg flex items-center justify-center text-slate-700 border border-slate-100 ring-8 ring-white">
              <i class="fas fa-eye text-3xl"></i>
            </div>
          </div>

          <!-- Content Body -->
          <div class="relative z-10">
            <p class="text-xl md:text-2xl text-slate-900 font-extrabold leading-relaxed mb-8 text-justify">
              {{ tip.title }}
            </p>

            <div class="w-16 h-1 bg-slate-300 rounded-full mb-10"></div>

            <p class="text-slate-600 text-base md:text-lg leading-relaxed text-justify whitespace-pre-line font-medium">
              {{ tip.description }}
            </p>
          </div>

          <!-- Actions -->
          <div class="mt-14 pt-10 border-t border-slate-100 flex flex-col md:flex-row items-center justify-center gap-6">
            <a routerLink="/" fragment="education" class="flex items-center gap-3 py-4 px-10 bg-slate-900 text-cream-50 font-bold text-sm rounded-3xl hover:bg-slate-800 transition-all shadow-lg active:scale-95 group">
              <i class="fas fa-arrow-right text-[10px] transform group-hover:translate-x-2 transition-transform duration-300"></i>
              <span>بازگشت به صفحه اصلی</span>
            </a>
          </div>

        </div>

      </div>
    </div>
  } @else {
    <!-- Loading State -->
    <div class="flex flex-col items-center justify-center py-40">
      <div class="w-10 h-10 border-3 border-slate-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="text-slate-400 font-bold text-xs">در حال بارگذاری راهنما...</p>
    </div>
  }

</div>
