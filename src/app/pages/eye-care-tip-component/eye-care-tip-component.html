<section class="py-24 bg-white relative overflow-hidden" dir="rtl" id="education">
  <!-- Decorative Background -->
  <div class="absolute top-0 right-0 w-96 h-96 bg-emerald-50 rounded-full blur-3xl -mr-48 -mt-48 opacity-60"></div>
  <div class="absolute bottom-0 left-0 w-96 h-96 bg-slate-50 rounded-full blur-3xl -ml-48 -mb-48 opacity-60"></div>

  <div class="container mx-auto px-6 relative z-10">

    <!-- Header -->
    <div class="max-w-2xl mb-16">
      <div class="flex items-center gap-3 mb-4">
        <span class="w-10 h-px bg-emerald-600"></span>
        <span class="text-emerald-600 font-bold text-sm uppercase tracking-widest">
          آموزش و سلامت
        </span>
      </div>

      <h2 class="text-4xl font-black text-slate-800 leading-tight mb-6">
        نکات مراقبت از <span class="text-emerald-600">بینایی شما</span>
      </h2>

      <p class="text-slate-500 font-medium leading-relaxed">
        توصیه‌های کاربردی و نکات بهداشتی برای حفظ سلامت چشم‌ها در زندگی روزمره و محیط کار.
      </p>
    </div>

    <!-- Tips Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

      <div
        *ngFor="let tip of tips"
        class="group bg-white border border-slate-100 p-10 rounded-[2.5rem] shadow-sm hover:shadow-xl hover:shadow-emerald-900/5 hover:-translate-y-2 transition-all duration-500">

        <div
          class="w-16 h-16 bg-emerald-50 rounded-2xl flex items-center justify-center mb-8 group-hover:bg-emerald-600 group-hover:text-white transition-colors duration-500">
          <i class="fas fa-eye text-2xl"></i>
        </div>

        <h3
          class="text-xl font-extrabold text-slate-800 mb-4 group-hover:text-emerald-700 transition-colors">
          {{ tip.title }}
        </h3>

        <p
          class="text-slate-500 text-sm leading-8 mb-8 line-clamp-4 font-medium">
          {{ tip.description }}
        </p>

        <a
          [routerLink]="['/eye-care-tip', tip.id]"
          class="inline-flex items-center gap-2 text-emerald-600 font-bold text-xs group/link">
          مطالعه کامل نکته
          <i
            class="fas fa-arrow-left transition-transform group-hover/link:-translate-x-1">
          </i>
        </a>

      </div>

    </div>

    <!-- Pagination -->
    <div
      *ngIf="tips.length > 0 && totalPages > 1"
      class="flex justify-center items-center gap-3 mt-16">

      <!-- Previous -->
      <button
        (click)="changePage(pageNumber - 1)"
        [disabled]="pageNumber === 1"
        class="w-12 h-12 rounded-2xl border border-slate-200 bg-white text-slate-600 hover:bg-emerald-50 disabled:opacity-40 disabled:cursor-not-allowed transition-all">

        <i class="fas fa-chevron-right"></i>
      </button>

      <!-- Page Numbers -->
      <button
        *ngFor="let page of pages"
        (click)="changePage(page)"
        [ngClass]="{
          'bg-emerald-600 text-white shadow-lg shadow-emerald-100': page === pageNumber,
          'bg-white border border-slate-200 text-slate-700 hover:bg-emerald-50': page !== pageNumber
        }"
        class="w-12 h-12 rounded-2xl font-bold transition-all duration-300">

        {{ page }}

      </button>

      <!-- Next -->
      <button
        (click)="changePage(pageNumber + 1)"
        [disabled]="pageNumber === totalPages"
        class="w-12 h-12 rounded-2xl border border-slate-200 bg-white text-slate-600 hover:bg-emerald-50 disabled:opacity-40 disabled:cursor-not-allowed transition-all">

        <i class="fas fa-chevron-left"></i>
      </button>

    </div>

    <!-- Empty State -->
    <div *ngIf="tips.length === 0" class="py-20 text-center">

      <div
        class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-6 text-slate-200">
        <i class="fas fa-info-circle text-3xl"></i>
      </div>

      <p class="text-slate-400 font-bold">
        در حال حاضر نکته‌ای برای نمایش وجود ندارد.
      </p>

    </div>

  </div>
</section>
