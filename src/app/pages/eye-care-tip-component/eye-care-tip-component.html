<section class="py-24 bg-cream-50 relative overflow-hidden border-b border-cream-100"
         dir="rtl"
         id="education">

  <!-- Decorative Background -->
  <div class="absolute top-0 right-0 w-96 h-96 bg-emerald-100/30 rounded-full blur-3xl -mr-48 -mt-48 opacity-60"></div>
  <div class="absolute bottom-0 left-0 w-96 h-96 bg-amber-100/30 rounded-full blur-3xl -ml-48 -mb-48 opacity-60"></div>

  <div class="container mx-auto px-6 relative z-10">

    <!-- Header -->
    <div class="max-w-2xl mb-14">

      <div class="flex items-center gap-3 mb-3">
        <span class="w-10 h-px bg-amber-500"></span>

        <span class="text-slate-700 font-semibold text-xs uppercase tracking-widest">
          آموزش و سلامت
        </span>
      </div>

      <h2 class="text-2xl md:text-3xl font-bold text-slate-900 mb-4">
        نکات مراقبت از
        <span class="text-emerald-700">
          بینایی شما
        </span>
      </h2>

      <p class="text-slate-600 leading-8 text-sm md:text-base">
        توصیه‌های کاربردی و نکات بهداشتی برای حفظ سلامت چشم‌ها در زندگی روزمره، مطالعه، کار با کامپیوتر و پیشگیری از بیماری‌های شایع چشم.
      </p>

    </div>

    <!-- Tips -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

      <div
        *ngFor="let tip of tips"
        class="group bg-white rounded-3xl overflow-hidden border border-cream-200 shadow-sm hover:shadow-xl hover:-translate-y-2 transition-all duration-500">

        <!-- Image -->
        <div class="relative overflow-hidden">

          <img
            [src]="eyeCareImagePath + tip.imageUrl || 'assets/images/eye-care/default.jpg'"
            [alt]="tip.title"
            class="w-full h-56 object-cover transition-transform duration-700 group-hover:scale-110">

          <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent"></div>

          <div class="absolute top-4 right-4">

            <div class="w-11 h-11 rounded-full bg-white/90 backdrop-blur flex items-center justify-center shadow-lg">

              <i class="fas fa-eye text-emerald-700"></i>

            </div>

          </div>

        </div>

        <!-- Content -->
        <div class="p-6">

          <h3 class="text-lg font-bold text-slate-800 mb-3 line-clamp-2 group-hover:text-emerald-700 transition-colors">

            {{ tip.title }}

          </h3>

          <p class="text-slate-600 text-sm leading-7 line-clamp-3 mb-6">

            {{ tip.description }}

          </p>

          <a
            [routerLink]="['/eye-care-tip', tip.id]"
            class="inline-flex items-center gap-2 text-emerald-700 hover:text-emerald-800 font-bold">

            مطالعه کامل

            <i class="fas fa-arrow-left text-amber-500 transition-transform duration-300 group-hover:-translate-x-1"></i>

          </a>

        </div>

      </div>

    </div>

    <!-- Pagination -->
    <div
      *ngIf="tips.length > 0 && totalPages > 1"
      class="flex justify-center items-center gap-2 mt-16">

      <button
        (click)="changePage(pageNumber - 1)"
        [disabled]="pageNumber === 1"
        class="w-10 h-10 rounded-xl border border-cream-200 bg-white hover:bg-cream-100 disabled:opacity-40">

        <i class="fas fa-chevron-right text-xs"></i>

      </button>

      <button
        *ngFor="let page of pages"
        (click)="changePage(page)"
        [ngClass]="{
          'bg-emerald-700 text-white border-emerald-700': page === pageNumber,
          'bg-white border border-cream-200 hover:bg-cream-100': page !== pageNumber
        }"
        class="w-10 h-10 rounded-xl font-bold transition-all">

        {{ page }}

      </button>

      <button
        (click)="changePage(pageNumber + 1)"
        [disabled]="pageNumber === totalPages"
        class="w-10 h-10 rounded-xl border border-cream-200 bg-white hover:bg-cream-100 disabled:opacity-40">

        <i class="fas fa-chevron-left text-xs"></i>

      </button>

    </div>

    <!-- Empty State -->
    <div
      *ngIf="tips.length === 0"
      class="py-20 text-center">

      <div class="w-16 h-16 rounded-full bg-cream-100 border border-cream-200 flex items-center justify-center mx-auto mb-4">

        <i class="fas fa-info-circle text-2xl text-emerald-500"></i>

      </div>

      <p class="text-emerald-800 font-bold">

        در حال حاضر نکته‌ای برای نمایش وجود ندارد.

      </p>

    </div>

  </div>

</section>
