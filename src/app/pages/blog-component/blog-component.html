<div class="bg-amber-50/50 py-24" dir="rtl" id="articles">
  <div class="container mx-auto px-6">

    <div class="text-center mb-16">
      <span class="text-amber-600 font-black text-xs uppercase tracking-[0.2em] mb-4 block">News & Articles</span>
      <h2 class="text-3xl md:text-4xl font-black text-slate-900 mb-4">آخرین اخبار و مقالات</h2>
      <div class="w-20 h-1.5 bg-blue-950 mx-auto rounded-full"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
      @for (item of blogs; track item.id) {
        <article class="group bg-white rounded-[2.5rem] overflow-hidden shadow-[0_10px_40px_-15px_rgba(0,0,0,0.05)] border border-amber-100 hover:border-amber-500/30 hover:shadow-[0_20px_50px_-20px_rgba(245,158,11,0.1)] transition-all duration-500">
          <!-- Decorative Amber Bar -->
          <div class="h-1.5 bg-amber-500/20 group-hover:bg-amber-500 transition-colors duration-500"></div>

          <div class="p-8">
            <div class="flex items-center gap-3 mb-6">
              <span class="w-10 h-10 rounded-xl bg-amber-50 flex items-center justify-center text-amber-600 group-hover:bg-blue-950 group-hover:text-white transition-all duration-500">
                <i class="fas fa-newspaper"></i>
              </span>
              <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest group-hover:text-amber-600 transition-colors">مجله سلامت</span>
            </div>

            <h3 class="text-xl font-black text-slate-900 mb-4 group-hover:text-blue-900 transition-colors duration-300">
              {{ item.title }}
            </h3>

            <p class="text-slate-500 text-sm leading-loose line-clamp-4 font-medium mb-8">
              {{ item.description }}
            </p>

            <button
              [routerLink]="['/blog', item.id]"
              class="w-full py-4 bg-amber-50/50 text-blue-950 font-black text-sm rounded-2xl group-hover:bg-blue-950 group-hover:text-white transition-all duration-300 flex items-center justify-center gap-2 border border-amber-100/50 group-hover:border-transparent">
              <span>ادامه مطلب</span>
              <i class="fas fa-arrow-left text-[10px]"></i>
            </button>
          </div>
        </article>
      }
    </div>

    @if (blogs.length === 0) {
      <div class="text-center py-20 text-slate-400">
        <i class="fas fa-inbox text-4xl mb-4 block"></i>
        <p>هنوز مقاله‌ای منتشر نشده است</p>
      </div>
    }
  </div>
</div>
