<div class="bg-cream-100 py-20 border-b border-cream-200" dir="rtl" id="articles">
  <div class="container mx-auto px-6">

    <div class="text-center mb-12">
      <span class="text-slate-600 font-semibold text-xs uppercase tracking-[0.2em] mb-3 block">News & Articles</span>
      <h2 class="text-xl md:text-2xl font-bold text-slate-900 mb-3">آخرین اخبار و مقالات</h2>
      <div class="w-12 h-0.5 bg-amber-500 mx-auto rounded-full"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (item of blogs; track item.id) {
        <article class="group bg-cream-50 rounded-2xl overflow-hidden shadow-xs border border-cream-200 hover:border-emerald-600 hover:shadow-md hover:shadow-emerald-900/5 transition-all duration-500">
          <!-- Decorative Top Bar -->
          <div class="h-1 bg-cream-200 group-hover:bg-emerald-800 transition-colors duration-500"></div>

          <div class="p-6">
            <div class="flex items-center gap-3 mb-4">
              <span class="w-8 h-8 rounded-lg bg-cream-100 border border-cream-200 flex items-center justify-center text-slate-700 group-hover:bg-emerald-800 group-hover:text-white transition-all duration-500 text-xs">
                <i class="fas fa-newspaper"></i>
              </span>
              <span class="text-[10px] font-bold text-amber-600 uppercase tracking-widest">مجله سلامت</span>
            </div>

            <h3 class="text-sm font-semibold text-slate-800 mb-3 group-hover:text-emerald-800 transition-colors duration-300">
              {{ item.title }}
            </h3>

            <p class="text-slate-600 text-xs leading-relaxed line-clamp-3 font-medium mb-6">
              {{ item.description }}
            </p>

            <button
              [routerLink]="['/blog', item.id]"
              class="w-full py-2.5 bg-cream-100 text-slate-700 font-bold text-xs rounded-xl border border-cream-200 group-hover:bg-emerald-800 group-hover:text-white transition-all duration-300 flex items-center justify-center gap-2">
              <span>ادامه مطلب</span>
              <i class="fas fa-arrow-left text-[10px] text-amber-500 group-hover:text-amber-300"></i>
            </button>
          </div>
        </article>
      }
    </div>

    @if (blogs.length === 0) {
      <div class="text-center py-20 text-emerald-800">
        <i class="fas fa-inbox text-4xl mb-4 block text-emerald-600/40"></i>
        <p class="text-sm font-semibold">هنوز مقاله‌ای منتشر نشده است</p>
      </div>
    }
  </div>
</div>
