<div class="bg-slate-50/50 py-24" dir="rtl" id="articles">
  <div class="container mx-auto px-6">

    <div class="text-center mb-16">
      <span class="text-slate-400 font-bold text-xs uppercase tracking-[0.2em] mb-4 block">News & Articles</span>
      <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-4">آخرین اخبار و مقالات</h2>
      <div class="w-16 h-1 bg-slate-300 mx-auto rounded-full"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (item of blogs; track item.id) {
        <article class="group bg-white rounded-[2rem] overflow-hidden shadow-xs border border-slate-100 hover:border-slate-200 hover:shadow-lg hover:shadow-slate-900/5 transition-all duration-500">
          <!-- Decorative Top Bar -->
          <div class="h-1 bg-slate-100 group-hover:bg-slate-900 transition-colors duration-500"></div>

          <div class="p-8">
            <div class="flex items-center gap-3 mb-6">
              <span class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center text-slate-700 group-hover:bg-slate-900 group-hover:text-white transition-all duration-500">
                <i class="fas fa-newspaper"></i>
              </span>
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">مجله سلامت</span>
            </div>

            <h3 class="text-lg font-bold text-slate-900 mb-4 group-hover:text-emerald-700 transition-colors duration-300">
              {{ item.title }}
            </h3>

            <p class="text-slate-500 text-xs md:text-sm leading-relaxed line-clamp-4 font-medium mb-8">
              {{ item.description }}
            </p>

            <button
              [routerLink]="['/blog', item.id]"
              class="w-full py-3.5 bg-slate-50 text-slate-900 font-bold text-xs md:text-sm rounded-xl group-hover:bg-slate-900 group-hover:text-white transition-all duration-300 flex items-center justify-center gap-2 border border-slate-100 group-hover:border-transparent">
              <span>ادامه مطلب</span>
              <i class="fas fa-arrow-left text-[10px]"></i>
            </button>
          </div>
        </article>
      }
    </div>

    @if (blogs.length === 0) {
      <div class="text-center py-20 text-slate-400">
        <i class="fas fa-inbox text-4xl mb-4 block text-slate-200"></i>
        <p class="text-sm font-semibold">هنوز مقاله‌ای منتشر نشده است</p>
      </div>
    }
  </div>
</div>
