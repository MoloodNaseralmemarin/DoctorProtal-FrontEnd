<section id="home" class="relative w-full py-4 md:py-8 lg:py-10 bg-cream-50">
  <div class="max-w-screen-2xl mx-auto px-4 md:px-8 lg:px-12">
    @if (state() === 'error') {
      <!-- Error State -->
      <div
        class="w-full aspect-video md:aspect-21/9 lg:aspect-21/7 bg-cream-100 border border-cream-200 rounded-2xl md:rounded-3xl lg:rounded-[3rem] shadow-xl flex flex-col items-center justify-center gap-4 px-6 text-center"
        role="alert"
      >
        <i class="fas fa-exclamation-circle text-amber-500 text-3xl" aria-hidden="true"></i>
        <p class="text-emerald-900 text-sm font-bold">بارگذاری بنر صفحه اصلی با خطا مواجه شد.</p>
        <button
          type="button"
          (click)="loadBanner()"
          class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-800 text-cream-50 text-xs font-bold hover:bg-emerald-700 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400 focus-visible:ring-offset-2"
        >
          <i class="fas fa-redo" aria-hidden="true"></i>
          تلاش دوباره
        </button>
      </div>
    } @else if (state() === 'empty') {
      <!-- No banner configured -->
      <div
        class="w-full aspect-video md:aspect-21/9 lg:aspect-21/7 bg-cream-100 border border-cream-200 rounded-2xl md:rounded-3xl lg:rounded-[3rem] flex flex-col items-center justify-center gap-3 px-6 text-center"
      >
        <i class="fas fa-image text-emerald-600/40 text-3xl" aria-hidden="true"></i>
        <p class="text-emerald-900 text-sm font-bold">بنری برای نمایش تنظیم نشده است.</p>
      </div>
    } @else {
      <!-- Loading Shimmer / Skeleton -->
      @if (state() === 'loading' || !imageLoaded()) {
        <div
          class="w-full aspect-video md:aspect-21/9 lg:aspect-21/7 bg-cream-100 animate-pulse relative overflow-hidden rounded-2xl md:rounded-3xl lg:rounded-[3rem] shadow-xl border border-cream-200"
          aria-hidden="true"
        >
          <div
            class="absolute inset-0 bg-linear-to-r from-transparent via-white/20 to-transparent skeleton-shimmer"
          ></div>
          <div class="absolute inset-0 flex items-center justify-center">
            <div class="flex flex-col items-center gap-4">
              <div class="w-16 h-16 rounded-full bg-cream-50 border border-cream-200 flex items-center justify-center">
                <i class="fas fa-image text-emerald-600 text-2xl animate-bounce-slow"></i>
              </div>
              <span class="text-emerald-800 text-sm font-semibold">در حال بارگذاری...</span>
            </div>
          </div>
        </div>
      }

      <!-- Banner Image -->
      <div
        class="relative w-full overflow-hidden rounded-2xl md:rounded-3xl lg:rounded-[3rem] shadow-xl border-4 border-cream-100"
        [class.hidden]="state() === 'loading' || !imageLoaded()"
      >
        @if (bannerUrl(); as url) {
          <img
            [src]="pathImageSiteBanner + url"
            [alt]="fallbackHeading"
            class="w-full h-auto object-cover aspect-video md:aspect-21/9 lg:aspect-21/7 block"
            (load)="onImageLoad()"
            (error)="onImageError()"
          />

          <!-- Subtle Decorative Overlays -->
          <div
            class="absolute inset-0 bg-linear-to-t from-emerald-950/10 to-transparent pointer-events-none"
          ></div>
          <div
            class="absolute inset-0 ring-1 ring-inset ring-emerald-900/5 pointer-events-none"
          ></div>
        }
      </div>
    }

    <!-- Page heading: the public banner payload has no caption, so the clinic name is used -->
    <div class="max-w-3xl mx-auto text-center mt-8 md:mt-10 px-2">
      <h1 class="text-2xl md:text-3xl font-bold text-emerald-950 leading-snug">
        {{ fallbackHeading }}
      </h1>
      <div class="w-12 h-0.5 bg-amber-500 mx-auto rounded-full mt-4" aria-hidden="true"></div>
      <p class="text-slate-600 text-sm md:text-base leading-8 mt-4">
        {{ tagline }}
      </p>
    </div>
  </div>
</section>
