<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4 py-12 relative overflow-hidden">

  <!-- Decorative background elements -->
  <div class="absolute top-0 right-0 w-96 h-96 bg-emerald-50 rounded-full blur-3xl -mr-48 -mt-48 opacity-60"></div>
  <div class="absolute bottom-0 left-0 w-96 h-96 bg-slate-100 rounded-full blur-3xl -ml-48 -mb-48 opacity-60"></div>

  <div class="w-full max-w-md relative">
    
    <!-- Logo/Brand area -->
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-3xl shadow-xl shadow-slate-200/50 mb-6">
        <i class="fas fa-eye text-4xl text-emerald-600"></i>
      </div>
      <h2 class="text-3xl font-extrabold text-slate-800 tracking-tight">
        ورود به پنل مدیریت
      </h2>
      <p class="mt-3 text-slate-500 font-medium">خوش آمدید، لطفاً وارد حساب خود شوید</p>
    </div>

    <div class="bg-white/80 backdrop-blur-xl border border-white rounded-[2.5rem] shadow-2xl shadow-slate-200/60 p-8 sm:p-10">

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">

        <!-- User Name -->
        <div class="space-y-2">
          <label for="userName" class="block text-sm font-bold text-slate-700 mr-1">
           نام کاربری
          </label>
          <div class="relative group">
            <div class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 group-focus-within:text-emerald-600 transition-colors">
              <i class="fas fa-user-circle"></i>
            </div>
            <input
              type="text"
              id="userName"
              formControlName="userName"
              class="w-full bg-slate-50 border border-slate-100 rounded-2xl py-3.5 pr-11 pl-4 text-slate-700 font-medium
                     focus:outline-none focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all"
              placeholder="نام کاربری خود را وارد کنید"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="space-y-2">
          <label for="password" class="block text-sm font-bold text-slate-700 mr-1">
            رمز عبور
          </label>
          <div class="relative group">
            <div class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 group-focus-within:text-emerald-600 transition-colors">
              <i class="fas fa-lock"></i>
            </div>
            <input
              type="password"
              id="password"
              formControlName="password"
              class="w-full bg-slate-50 border border-slate-100 rounded-2xl py-3.5 pr-11 pl-4 text-slate-700 font-medium
                     focus:outline-none focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all"
              placeholder="********"
            />
          </div>
        </div>

        <!-- Error Message -->
        @if (errorMessage()) {
        <div
          class="flex items-center gap-2 text-red-600 bg-red-50 p-4 rounded-2xl text-sm font-bold animate-in fade-in slide-in-from-top-2 duration-300">
          <i class="fas fa-exclamation-circle text-lg"></i>
          <span>{{ errorMessage() }}</span>
        </div>
        }

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="loginForm.invalid || isSubmitting()"
          class="group relative w-full overflow-hidden rounded-2xl bg-emerald-900 py-4 text-white font-bold text-lg
                 shadow-xl shadow-emerald-900/20 hover:bg-emerald-800 transition-all active:scale-[0.98]
                 disabled:bg-slate-200 disabled:text-slate-400 disabled:shadow-none disabled:cursor-not-allowed"
        >
          <div class="relative z-10 flex items-center justify-center gap-2">
            <span>{{ isSubmitting() ? 'در حال ورود...' : 'ورود به سیستم' }}</span>
            <i class="fas" [class.fa-arrow-left]="!isSubmitting()" [class.fa-circle-notch]="isSubmitting()" [class.animate-spin]="isSubmitting()" aria-hidden="true"></i>
          </div>
          <div class="absolute inset-0 bg-gradient-to-r from-emerald-800 to-emerald-900 opacity-0 group-hover:opacity-100 transition-opacity"></div>
        </button>

      </form>

      <div class="mt-10 text-center">
        <a href="/" class="text-sm font-bold text-emerald-700 hover:text-emerald-900 transition-colors">
          <i class="fas fa-home ml-1 text-xs"></i>
          بازگشت به صفحه اصلی
        </a>
      </div>

    </div>

    <!-- Footer Copyright -->
    <p class="mt-10 text-center text-slate-400 text-xs font-medium">
      &copy; {{ currentYear }} تمامی حقوق برای دکتر حق‌پرست محفوظ است
    </p>

  </div>
</div>
