<!-- Drawer backdrop (mobile only) -->
@if (open()) {
  <div
    class="fixed inset-0 z-40 bg-emerald-950/50 backdrop-blur-sm lg:hidden"
    (click)="closed.emit()"
    aria-hidden="true"
  ></div>
}

<aside
  id="admin-sidebar"
  class="fixed inset-y-0 right-0 z-50 w-72 max-w-[85vw] bg-white border-l border-slate-100 flex flex-col h-screen shadow-2xl transition-transform duration-300 ease-out lg:static lg:top-0 lg:shadow-sm lg:translate-x-0 lg:visible lg:z-50"
  [class.translate-x-full]="!open()"
  [class.invisible]="!open()"
>
  <!-- Sidebar Header -->
  <div class="p-6 flex items-center gap-4 border-b border-slate-50 mb-4">
    <div class="w-12 h-12 bg-emerald-50 rounded-2xl flex items-center justify-center shadow-inner">
      <i class="fas fa-user-shield text-emerald-600 text-xl" aria-hidden="true"></i>
    </div>
    <div>
      <h1 class="text-lg font-extrabold text-slate-800 leading-tight">پنل مدیریت</h1>
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Doctor Portal</p>
    </div>

    <!-- Drawer close (mobile only) -->
    <button
      type="button"
      (click)="closed.emit()"
      aria-label="بستن منوی مدیریت"
      class="lg:hidden mr-auto p-2 rounded-xl text-slate-500 bg-slate-50 hover:bg-slate-100 transition-all active:scale-90"
    >
      <i class="fas fa-times" aria-hidden="true"></i>
    </button>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 px-4 space-y-1 overflow-y-auto" aria-label="منوی پنل مدیریت">
    <div class="px-3 mb-2">
      <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">منوی اصلی</span>
    </div>

    <a *ngFor="let item of menuItems"
       [routerLink]="item.path"
       (click)="closed.emit()"
       routerLinkActive="bg-emerald-50 text-emerald-700 border-emerald-100"
       [routerLinkActiveOptions]="{exact: true}"
       class="flex items-center gap-3 px-4 py-3.5 rounded-2xl text-sm font-bold text-slate-600 hover:bg-slate-50 hover:text-emerald-600 transition-all group border border-transparent mb-1">
      <div class="w-8 h-8 rounded-xl bg-transparent flex items-center justify-center transition-colors group-hover:bg-white group-hover:shadow-sm">
        <i [class]="item.icon" class="text-lg opacity-70 group-hover:opacity-100 transition-opacity" aria-hidden="true"></i>
      </div>
      <span>{{ item.label }}</span>
    </a>
  </nav>

  <!-- Account -->
  <div class="p-4 border-t border-slate-100">
    <button
      type="button"
      (click)="onLogout()"
      class="w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl text-sm font-bold text-red-600 hover:bg-red-50 border border-transparent hover:border-red-100 transition-all"
    >
      <div class="w-8 h-8 rounded-xl bg-red-50 flex items-center justify-center">
        <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
      </div>
      <span>خروج از حساب</span>
    </button>
  </div>
</aside>
